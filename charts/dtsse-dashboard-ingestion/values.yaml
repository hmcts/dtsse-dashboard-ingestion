job:
  image: hmctsprod.azurecr.io/dtsse/dashboard-ingestion:latest
  aadIdentityName: dtsse
  environment:
    SLACKBOT_COSMOS_ENABLED: "false"
    SLACK_COSMOS_ACCOUNT_NAME: "platops-slack-help-bot-ptl"
    SLACK_COSMOS_DATABASE: "help-requests"
    SLACK_COSMOS_CONTAINER: "help-requests"
  keyVaults:
    dtsse:
      secrets:
        - name: AppInsightsConnectionString
          alias: APPLICATIONINSIGHTS_CONNECTION_STRING
        - azure-finops-connection-string
        - github-token
        - sonar-token
        - jira-token
        - db-url
        - cosmos-key
        - cosmos-db-name
        - jenkins-databases
        - snow-username
        - snow-password
        - slackbot-cosmos-key
  schedule: "0/10 * * * *"
global:
  jobKind: CronJob
  enableKeyVaults: true
  tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
  concurrencyPolicy: Forbid
